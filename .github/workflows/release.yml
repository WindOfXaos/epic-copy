name: Release

# Every merge to master publishes a ready-to-run build as a GitHub Release,
# with release notes generated from the pull requests merged since the last one.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          # Version comes from Cargo.toml; the run number makes every build unique.
          # Bump `version` in Cargo.toml to start a new version line.
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/EpicCopy-$env:TAG-windows-x64.zip"
          Compress-Archive -Path target/release/epic-copy.exe, README.md -DestinationPath $zip
          Copy-Item target/release/epic-copy.exe "dist/EpicCopy-$env:TAG-windows-x64.exe"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @"
          **Download:** ``EpicCopy-$env:TAG-windows-x64.zip``, unzip it and run ``epic-copy.exe`` (Windows 10/11, no install needed). The bare ``.exe`` is attached too; ``SHA256SUMS.txt`` has checksums.

          Built from $env:GITHUB_SHA.
          "@
          # PowerShell doesn't expand globs for native commands; pass the files.
          $assets = (Get-ChildItem dist -File).FullName
          # --generate-notes appends GitHub's list of merged PRs since the previous release.
          gh release create $env:TAG @assets `
            --target $env:GITHUB_SHA `
            --title "Epic Copy $env:VERSION (build $env:GITHUB_RUN_NUMBER)" `
            --notes $notes `
            --generate-notes `
            --latest
